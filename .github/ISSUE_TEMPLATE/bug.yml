name: Bug
description: Report a reproducible problem
title: "Bug: "
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: |
        Report a reproducible problem with the prototype or repository.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Describe the observed issue.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happens?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Example: UE 5.7.x, macOS, Apple Silicon"

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or Logs
      description: Add relevant screenshots, logs, or error messages.